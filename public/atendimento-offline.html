<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sem conexão — Lúmen Atendimento</title>
<!--
  TELA ESTÁTICA "SEM CONEXÃO" do aplicativo de Atendimento. É a única página que o service worker guarda no aparelho
  (public/sw-atendimento.js): não tem dado de conversa, de cliente nem de escritório, nem script de terceiro.
  Segue o tema escolhido no app (Dia / Noite / Automático, chave rp-atendimento-theme); sem escolha vale o Dia, como no app.
  Cores: as mesmas do app (--atd-*), com contraste AA nos dois temas.
-->
<style>
  :root { --tela:#ffffff; --tinta:#16191d; --apoio:#4f5560; --pilula:#e9e7e1; --ouro:#c9962f; --ouro-tx:#16191d; color-scheme: light; }
  :root[data-tema="noite"] { --tela:#14151c; --tinta:#f4f4ef; --apoio:#a6abbd; --pilula:#262833; --ouro:#c9962f; --ouro-tx:#16191d; color-scheme: dark; }
  @media (prefers-color-scheme: dark) { :root:not([data-tema]) { --tela:#14151c; --tinta:#f4f4ef; --apoio:#a6abbd; --pilula:#262833; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; background: var(--tela); color: var(--tinta); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  main { width: 100%; max-width: 360px; text-align: center; }
  .icone { width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 50%; background: var(--pilula); display: flex; align-items: center; justify-content: center; }
  .icone svg { width: 30px; height: 30px; stroke: var(--tinta); }
  h1 { margin: 0 0 8px; font-size: 26px; line-height: 1.2; font-weight: 700; }
  p { margin: 0 0 12px; font-size: 16px; line-height: 1.5; color: var(--apoio); }
  button { min-height: 44px; margin-top: 12px; padding: 0 28px; border: 0; border-radius: 999px; background: var(--ouro); color: var(--ouro-tx); font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--tinta); outline-offset: 3px; }
</style>
<script>
  try {
    // Valores do app: "light" (Dia), "dark" (Noite), "auto" (segue o sistema); sem escolha vale o Dia.
    var t = window.localStorage.getItem("rp-atendimento-theme");
    if (t !== "auto") document.documentElement.setAttribute("data-tema", t === "dark" ? "noite" : "dia");
  } catch (e) {}
</script>
</head>
<body>
<main>
  <div class="icone" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.8a15 15 0 0 1 4.2-2.6M22 8.8a15 15 0 0 0-8.2-3.7M5 12.9a10 10 0 0 1 5-2.7M19 12.9a10 10 0 0 0-2.4-1.7M8.5 16.4a5 5 0 0 1 3.5-1.3M12 20h.01M2 2l20 20"/></svg>
  </div>
  <h1>Sem conexão</h1>
  <p>Não foi possível abrir o Lúmen Atendimento porque o aparelho está sem internet.</p>
  <p>Por segurança, as conversas não ficam guardadas no aparelho. Volte a ficar online e tente de novo.</p>
  <button type="button" onclick="window.location.reload()">Tentar de novo</button>
</main>
</body>
</html>
